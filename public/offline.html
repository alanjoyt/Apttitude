<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline Practice | Apttitudee</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background-color: var(--paper, #F6F1E7);
      color: var(--ink, #14213D);
      font-family: var(--font-body, system-ui, sans-serif);
      margin: 0;
    }
    .offline-card {
      max-width: 440px;
      width: 100%;
      background: var(--surface, #FCFAF6);
      padding: 36px 24px;
      border: 2px solid var(--border-strong, #14213D);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--border-strong, #14213D);
    }
    .offline-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .offline-title {
      font-family: var(--font-heading, Georgia, serif);
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 10px;
    }
    .offline-desc {
      color: var(--ink-muted, #4A4E57);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .offline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 28px;
      background-color: var(--marker-orange, #F26B1D);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      border: 1.5px solid var(--border-strong, #14213D);
      box-shadow: 2px 2px 0 var(--border-strong, #14213D);
      cursor: pointer;
      font-size: 1rem;
    }
    .offline-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">You Are Offline</h1>
    <p class="offline-desc">
      Your mobile device lost connection to the network. Don't worry! Your quiz progress and coin balances are saved locally.
    </p>
    <button type="button" class="offline-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
